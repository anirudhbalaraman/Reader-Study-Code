<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Study</title>
<link rel="stylesheet" href="/static/css/slicer.css">
</head>
<body>
<div class="app">
  <!-- menu bar -->
  <div class="menubar">
    <img class="brand-logo" src="/static/img/comfort-logo-transparent.svg" alt="COMFORT">
    <span class="title" id="study-title">Reader Study</span>
    <button class="link" id="menu-worklist">Worklist</button>
    <button class="link" id="menu-help">Help</button>
    <a href="/admin" id="menu-admin" hidden>Admin</a>
    <span class="spacer"></span>
    <span class="user" id="user-name"></span>
    <button class="link" id="menu-password">Change password</button>
    <button class="link" id="menu-logout">Log out</button>
  </div>

  <!-- toolbar -->
  <div class="toolbar">
    <span class="label">Modules:</span>
    <select class="module-select" disabled><option>PI-RADS Reader Study</option></select>
    <span class="sep"></span>
    <span class="label">Layout</span>
    <select id="tb-layout" title="View layout"></select>
    <span class="sep"></span>
    <button class="tb active" id="tb-wl" title="Window/Level (left-drag)  [Esc]">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
    <button class="tb" id="tb-pan" title="Pan (left-drag). Also: middle-drag or Shift+left-drag">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>
    </button>
    <button class="tb" id="tb-zoom" title="Zoom (left-drag up/down). Also: right-drag or Ctrl/Cmd+scroll">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5 20 20M7.5 10h5M10 7.5v5"/></svg>
    </button>
    <button class="tb" id="tb-place" title="Place lesion point (click in any view)  [P]">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="12" r="5" /><circle cx="10" cy="12" r="1.3" fill="currentColor"/><path d="M19 3v6M16 6h6"/></svg>
    </button>
    <span class="sep"></span>
    <button class="tb" id="tb-cross" title="Crosshair (Shift+move to position)  [C]">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v7M12 15v7M2 12h7M15 12h7"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
    </button>
    <button class="tb active" id="tb-link" title="Link views (slices, zoom and pan move together)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    </button>
    <button class="tb" id="tb-reset" title="Reset field of view  [R]">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><rect x="9" y="9" width="6" height="6"/></svg>
    </button>
  </div>

  <div class="main">
    <!-- module panel -->
    <div class="module-panel">
      <div class="module-scroll" id="module"></div>
      <div class="data-probe" id="probe"><div class="dp-title">Data Probe</div><div class="muted">Move the mouse over a view.</div></div>
    </div>
    <!-- slice views -->
    <div class="views" id="views"></div>
  </div>

  <div class="statusbar">
    <span id="status-case"></span>
    <span class="spacer"></span>
    <span id="status-mode">Mode: Window/Level</span>
    <span class="save-state ok" id="save-state">Saved</span>
  </div>
</div>
<script type="module" src="/static/js/reader.js"></script>
</body>
</html>
